skills:
  - id: servicenow-mcp
    name: ServiceNow MCP
    description: >
      Reverse engineer ServiceNow features by querying tables, running background scripts,
      and inspecting artifact metadata via the snow CLI in MCP mode.
    file: platforms/servicenow/SKILL.md
    platform: servicenow
    guide: platforms/servicenow/01-setup.md
    load_via:
      - /skills  # in GitHub Copilot CLI
    prerequisites:
      tools:
        - name: snow
          description: CLI for interacting with ServiceNow (table API + background scripts + MCP server)
          install: 'pipx install "git+https://github.com/chovanecm/snow-run-python@main"'
          verify: snow --help
      instance_config:
        commands:
          - snow add --default <your-instance>.service-now.com
          - snow login
      mcp:
        copilot_cli:
          config_file: ~/.copilot/mcp-config.json
          server:
            name: servicenow
            type: local
            command: snow
            args:
              - mcp
            tools:
              - "*"
        claude_desktop:
          config_file_macos: ~/Library/Application Support/Claude/claude_desktop_config.json
          config_file_windows: "%APPDATA%\\Claude\\claude_desktop_config.json"
          server:
            name: servicenow
            command: snow
            args:
              - mcp
